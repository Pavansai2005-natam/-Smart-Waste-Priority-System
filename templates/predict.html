<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predict Waste | SmartWaste</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        ♻ SmartWaste
    </div>

    <ul class="nav-links">

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/predict">Predict</a>
        </li>

        <li>
            <a href="/dashboard">Dashboard</a>
        </li>

    </ul>

</nav>



<!-- PREDICT PAGE -->

<section class="predict-page">

    <div class="predict-container">


        <!-- HEADING -->

        <div class="predict-heading">

            <span class="predict-icon">
                ♻️
            </span>

            <h1>
                Waste Priority Prediction
            </h1>

            <p>
                Enter the waste details below to calculate
                its priority level.
            </p>

        </div>



        <!-- FORM -->

        <form
            action="/predict"
            method="POST"
            class="predict-form"
        >


            <!-- AREA -->

            <div class="form-group">

                <label for="area">
                    Waste Area
                </label>

                <select
                    id="area"
                    name="area"
                    required
                >

                    <option value="">
                        Select Area
                    </option>

                    <option value="Residential">
                        Residential
                    </option>

                    <option value="Commercial">
                        Commercial
                    </option>

                    <option value="Industrial">
                        Industrial
                    </option>

                </select>

            </div>



            <!-- QUANTITY -->

            <div class="form-group">

                <label for="quantity">
                    Waste Quantity (kg)
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    placeholder="Enter waste quantity"
                    min="0"
                    step="0.1"
                    required
                >

            </div>



            <!-- DELAY -->

            <div class="form-group">

                <label for="delay">
                    Collection Delay (days)
                </label>

                <input
                    type="number"
                    id="delay"
                    name="delay"
                    placeholder="Enter delay in days"
                    min="0"
                    required
                >

            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="predict-submit-btn"
            >
                🚀 Predict Priority
            </button>


        </form>



        <!-- BACK -->

        <a
            href="/"
            class="back-home"
        >
            ← Back to Home
        </a>


    </div>

</section>


</body>

</html>
